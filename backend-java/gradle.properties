# The machine's default JAVA_HOME points at a legacy JDK 8, which cannot run
# Gradle 9.8. Pin the Gradle JVM to the installed JDK 26 so `./gradlew` works
# without the caller having to export JAVA_HOME. Adjust this path if the JDK moves.
org.gradle.java.home=/opt/homebrew/Cellar/openjdk/26.0.2.1/libexec/openjdk.jdk/Contents/Home
